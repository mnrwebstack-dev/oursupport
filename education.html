html.big{font-size:120%}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins','Noto Sans Malayalam',system-ui,sans-serif;line-height:1.7}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;padding:10px 5vw;background:var(--card);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem;color:var(--teal);cursor:pointer;max-width:340px;line-height:1.3}
nav{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
nav button{background:none;border:0;padding:6px 10px;border-radius:8px;font:inherit;font-size:.88rem;color:var(--ink);cursor:pointer}
nav button.on{background:var(--teal);color:var(--on)}
nav .lg{border:1px solid var(--line);margin-left:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 5vw}
.hero{position:relative;overflow:hidden;background:var(--tealx);color:#fff}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.3fr .7fr;gap:24px;align-items:center;padding-top:72px;padding-bottom:80px}
.hero .wrap>div:first-child{animation:rise .9s ease-out both}
.hero h1{font-size:clamp(1.8rem,4.6vw,3rem);line-height:1.3;margin:0 0 14px;font-weight:700}
.hero p{max-width:56ch;color:#CFE3E0;font-size:1.05rem;margin:0 0 24px}
.hero svg.art{width:100%;max-width:260px;justify-self:center}
.hero svg.wave{position:absolute;left:0;bottom:-1px;width:100%;height:40px;z-index:1}
@media(max-width:720px){.hero .wrap{grid-template-columns:1fr}.hero svg.art{max-width:150px}}
.bg i{position:absolute;border-radius:50%;border:10px solid rgba(255,255,255,.07);animation:fl 16s ease-in-out infinite alternate}
.bg i:nth-child(1){width:320px;height:320px;left:-90px;top:-100px}
.bg i:nth-child(2){width:220px;height:220px;right:6%;bottom:-70px;border-color:rgba(242,169,59,.16);animation-delay:-5s}
.bg i:nth-child(3){width:90px;height:90px;left:44%;top:14%;border-width:6px;animation-duration:11s}
.bg i:nth-child(4){width:60px;height:60px;right:30%;top:10%;border-width:5px;border-color:rgba(242,169,59,.2);animation-duration:13s}
@keyframes fl{from{transform:translate(0,0) rotate(0)}to{transform:translate(26px,-22px) rotate(25deg)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.spark{transform-box:fill-box;transform-origin:center;animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.2)}}
.btn{background:var(--teal);color:var(--on);border:0;border-radius:10px;padding:11px 22px;font:inherit;font-weight:600;cursor:pointer}
.btn.gold{background:var(--gold);color:#16232B}

.btn.bad{background:var(--rose);color:#fff}

.m{color:var(--mute);font-size:.93rem}

.tile:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(18,80,75,.14)}

.steps div{position:relative;padding-left:52px}
.steps div:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:38px;height:38px;border-radius:50%;background:var(--teal);color:var(--on);display:grid;place-items:center;font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
label{display:block;font-size:.88rem;color:var(--mute);margin-bottom:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:1.05rem}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:0 10px;font-size:.8rem;margin:2px 4px 0 0}
.note{background:rgba(242,169,59,.18);border-radius:10px;padding:10px 14px;font-size:.9rem;margin-top:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 16px;font:inherit;cursor:pointer}.tabs button.on{background:var(--teal);color:var(--on);border-color:var(--teal)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:10px}summary{cursor:pointer;font-weight:600}
.badge{display:inline-block;border-radius:20px;padding:1px 12px;font-size:.82rem;font-weight:600;background:rgba(242,169,59,.28)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:9}

footer{background:var(--tealx);color:#CFE3E0;padding:24px 5vw;font-size:.88rem;margin-top:30px}
@media(prefers-reduced-motion:reduce){.bg i,.spark,.hero .wrap>div:first-child{animation:none}}
.homelink{font-size:.85rem;font-weight:600;color:var(--teal);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:4px 12px;white-space:nowrap}
</style>

function schCard(s){return `<div class="card"><h3>${L(s.n)}</h3><div><span class="tag">${L([['കേന്ദ്രം','Central'],['സംസ്ഥാനം','State'],['സ്വകാര്യ / ട്രസ്റ്റ്','Private / trust']][s.b])}</span>${s.lv.map(l=>`<span class="tag">${L(LV[l])}</span>`).join('')}</div><p class="m" style="margin:4px 0">${L(s.d)}</p><span class="m">${t('link')}<br>${t('chk')}</span><button class="btn ghost" style="color:var(--ink);margin-top:8px" onclick="go('req')">${t('ask')}</button></div>`}
function finder(){return S(`<h2>${t('finder')}</h2><p class="m">${t('fq')}</p><div class="panel" style="margin-top:0"><div class="grid">
<div><label>${t('lv')}</label><select id="q_lv">${opt(LV)}</select></div><div><label>${t('ct')}</label><select id="q_ct">${opt(CT)}</select></div>
<div><label>${t('gn')}</label><select id="q_gn">${opt([[t('fem'),t('fem')],[t('mal'),t('mal')],[t('oth'),t('oth')]])}</select></div>
<div><label>${t('dis')}</label><select id="q_dis">${opt([[t('no'),t('no')],[t('yes'),t('yes')]])}</select></div>
<div><label>${t('inc')}</label><select id="q_in">${opt(IN)}</select></div></div><p><button class="btn" onclick="runFinder()">${t('show')}</button></p></div>`
+(fres?`<h2 style="margin-top:28px">${t('res')}</h2>${fres.length?`<div class="cards">${fres.map(schCard).join('')}</div><div class="note">${t('elig')}</div>`:`<p class="m">${t('nores')}</p><button class="btn" onclick="go('req')">${t('c2')}</button>`}`:''))}
function runFinder(){const v=i=>+document.getElementById(i).value,lv=v('q_lv'),ct=CK[v('q_ct')],girl=v('q_gn')==0,dis=v('q_dis')==1,inc=IN[v('q_in')][2];
 fres=SCH.filter(s=>s.lv.includes(lv)&&inc<=s.mi&&(s.ct.includes('all')||s.ct.includes(ct)||s.ct.includes('pwd')&&dis||s.ct.includes('girl')&&girl||s.ct.includes('ews')&&inc<=1));draw()}
function sch(){const lv=fv.sl,ct=fv.sc;const l=SCH.filter(s=>(lv==null||lv===''||s.lv.includes(+lv))&&(ct==null||ct===''||s.ct.includes(ct)||s.ct.includes('all')));
 return S(`<h2>${t('sct')}</h2><div class="panel" style="margin-top:0"><div class="grid"><div><label>${t('lv')}</label><select id="sl" onchange="draw()">${opt(LV,1)}</select></div><div><label>${t('ct')}</label><select id="sc" onchange="draw()"><option value="">${t('f_all')}</option>${CK.map((k,i)=>i?`<option value="${k}">${L(CT[i])}</option>`:'').join('')}<option value="pwd">${L(['ഭിന്നശേഷി','Disability'])}</option><option value="girl">${L(['പെൺകുട്ടി','Girl student'])}</option><option value="ews">${L(['സാമ്പത്തിക പിന്നാക്കം','Economically weaker'])}</option></select></div></div></div><div class="cards">${l.map(schCard).join('')||`<p class="m">${t('nores')}</p>`}</div><div class="note">${t('demo')}</div>`)}
function guide(){return S(`<h2>${t('gt')}</h2><p class="m">${t('gd')}</p>`+GD.map(g=>`<details><summary>${g[0]} ${L([g[1],g[2]])}</summary><ul>${(lang=='ml'?g[3]:g[4]).map(x=>`<li>${x}</li>`).join('')}</ul></details>`).join('')+`<p style="margin-top:20px"><button class="btn" onclick="go('req')">${t('req')}</button></p>`)}
function xf(){const x=XM[rtype];return x.map(k=>`<div><label>${t(k)}</label>${k=='x21'?`<select id="r_${k}"><option value="">—</option>${opt(IN)}</select>`:`<select id="r_${k}">${opt(XO[k])}</select>`}</div>`).join('')}
function req(){
 if(doneId){
  const r=db.r.find(x=>x.id==doneId)||{};
  const ref='EDU-'+String(doneId).padStart(4,'0');
  const dName=DIST[r.d]?DIST[r.d][0]:'';
  const wa=typeof createWhatsAppDispatch==='function'?createWhatsAppDispatch(L(T.brand),ref,{
   'പേര്':r.name,
   'പ്രായം':r.age,
   'മൊബൈൽ':r.ph,
   'ജില്ല':dName,
   'ക്ലാസ്':r.cls||'—',
   'വിഭാഗം':L(T['t'+r.ty]),
   'രക്ഷിതാവ്':r.gn?(r.gn+' ('+r.gp+')'):'—',
   'കുറിപ്പ്':r.note||'—'
  }):'#';
  return S(`<h2>${t('done')}</h2><div class="panel" style="margin-top:0">
   <p>${t('doned')}: <b>${ref}</b></p>
   <p class="m">${t('donen')}</p>
   <div style="display:flex;gap:10px;flex-wrap:wrap;margin:18px 0">
    <a class="btn" style="background:#25D366;color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px;font-weight:700" href="${wa}" target="_blank" rel="noopener">
     <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.23 8.23 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23-1.48 0-2.93-.39-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.32a8.19 8.19 0 0 1-1.26-4.36c0-4.54 3.69-8.25 8.24-8.25m-2.52 3.69c-.17 0-.44.07-.67.31-.23.25-.88.86-.88 2.1 0 1.23.91 2.43 1.03 2.59.13.17 1.79 2.72 4.33 3.82.6.26 1.07.42 1.43.53.61.2 1.16.17 1.6.1.49-.07 1.51-.62 1.72-1.21.21-.59.21-1.1.15-1.2-.07-.11-.24-.17-.51-.3-.27-.14-1.6-.79-1.85-.88-.24-.09-.42-.14-.6.12-.17.25-.67.85-.82 1.02-.15.17-.3.19-.57.06-.27-.14-1.13-.42-2.15-1.33-.79-.71-1.33-1.58-1.48-1.84-.15-.26-.02-.4.12-.53.12-.12.27-.31.4-.46.14-.15.18-.26.28-.45.09-.2.04-.36-.03-.49-.06-.13-.57-1.38-.78-1.9-.21-.5-.42-.43-.57-.44-.15-.01-.32-.01-.5-.01"/></svg>
     ${lang=='ml'?'വാട്സ്ആപ്പ് വഴി അറിയിക്കുക':'Send via WhatsApp'}
    </a>
    <button class="btn ghost" onclick="go('track')">${t('track')}</button>
   </div>
  </div>`);
 }
 return S(`<h2>${t('rt')}</h2><p class="m">${t('rd')}</p><div class="tabs">${[0,1,2].map(i=>`<button class="${rtype==i?'on':''}" onclick="rtype=${i};draw()">${t('t'+i)}</button>`).join('')}</div>
<div class="panel"><div class="grid"><div><label>${t('n')} *</label><input id="r_name"></div><div><label>${t('ag')} *</label><input id="r_age" type="number" min="3" max="90" oninput="gChg()"></div><div><label>${t('ph')} *</label><input id="r_ph" inputmode="numeric" maxlength="10"></div>
<div><label>${t('dd')} *</label><select id="r_d">${opt(DIST)}</select></div><div><label>${t('cl')}</label><input id="r_cls"></div>${xf()}</div>
<div id="gbox" style="display:none;margin-top:14px"><p class="m">${t('gm')}</p><div class="grid"><div><label>${t('g1')} *</label><input id="r_gn"></div><div><label>${t('g2')} *</label><input id="r_gp" inputmode="numeric" maxlength="10"></div></div></div>
<div style="margin-top:14px"><label>${t('nt')}</label><textarea id="r_note" rows="3"></textarea></div>
<p><label style="color:var(--ink)"><input type="checkbox" id="r_cs"> ${t('cons')}</label></p><p><button class="btn" onclick="sendReq()">${t('send')}</button></p></div>`)}
function gChg(){const a=+((document.getElementById('r_age')||{}).value),b=document.getElementById('gbox');if(b)b.style.display=a>0&&a<18?'':'none'}
function sendReq(){const v=i=>{const e=document.getElementById(i);return e?e.value.trim():''},age=+v('r_age');
 if(!v('r_name')||!(age>0)||v('r_ph').length!=10||v('r_d')===''){toast(t('err'));return}
 if(typeof OurValidator!=='undefined'&&!OurValidator.isValidPhone(v('r_ph'))){toast(lang=='ml'?'ശരിയായ 10 അക്ക മൊബൈൽ നമ്പർ നൽകുക':'Enter valid 10-digit mobile');return}
 if(age<18&&(!v('r_gn')||v('r_gp').length!=10)){toast(t('errg'));return}
 if(age<18&&typeof OurValidator!=='undefined'&&!OurValidator.isValidPhone(v('r_gp'))){toast(lang=='ml'?'രക്ഷിതാവിന്റെ ശരിയായ 10 അക്ക നമ്പർ നൽകുക':'Enter valid guardian 10-digit mobile');return}
 if(!document.getElementById('r_cs').checked){toast(t('errc'));return}
 const k=XM[rtype],r={id:db.n++,ty:rtype,name:v('r_name'),age,gn:v('r_gn'),gp:v('r_gp'),ph:v('r_ph'),d:+v('r_d'),cls:v('r_cls'),x1:v('r_'+k[0]),x2:k[1]?v('r_'+k[1]):'',note:v('r_note'),s:0,date:new Date().toISOString().slice(0,10)};
 db.r.push(r);save();
 if(typeof syncRecordToCloud==='function'){syncRecordToCloud('education','request',{...r,ref:'EDU-'+String(r.id).padStart(4,'0'),district:DIST[r.d]?DIST[r.d][0]:''})}
 try{localStorage.removeItem('kth_draft_education')}catch(e){};fv={};doneId=r.id;draw()}
function inst(){const d=fv.id_;const l=INST.filter(x=>d==null||d===''||x.d==+d);
 return S(`<h2>${t('it')}</h2><p class="m">${t('itd')}</p><div class="panel" style="margin-top:0;max-width:340px"><label>${t('dd')}</label><select id="id_" onchange="draw()">${opt(DIST,1)}</select></div><div class="cards">${l.map(x=>`<div class="card"><h3>${L(x.n)}</h3><div><span class="tag">${L(x.s)}</span><span class="tag">${L(DIST[x.d])}</span></div><p class="m" style="margin:4px 0">${L(x.i)}</p></div>`).join('')||`<p class="m">${t('nores')}</p>`}</div><div class="note">${t('demo')}</div>`)}
function track(){const p=fv.tp;const l=p&&p.length==10?db.r.filter(r=>r.ph==p||r.gp==p):null;
 return S(`<h2>${t('tr')}</h2><div class="panel" style="margin-top:0;max-width:460px"><p class="m">${t('trd')}</p><input id="tp" inputmode="numeric" maxlength="10"><p><button class="btn" onclick="draw()">${t('trb')}</button></p></div>`+(l?(l.length?`<div class="cards">${l.map(r=>`<div class="card"><b>EDU-${String(r.id).padStart(4,'0')}</b><span>${t('t'+r.ty)}</span><span class="m">${r.date}</span><span class="badge">${t('st'+r.s)}</span></div>`).join('')}</div>`:`<p class="m" style="margin-top:14px">${t('trn')}</p>`):''))}
function admin(){
 if(!isAdmin)return S(`<h2>${t('al')}</h2><div class="panel" style="max-width:340px"><label>${t('pin')}</label><input id="pin" type="password"><p><button class="btn" onclick="if(document.getElementById('pin').value==(window.OURSUPPORT_CONFIG&&OURSUPPORT_CONFIG.adminPin||'974522')){isAdmin=true;draw()}else toast(t('badpin'))">${t('enter')}</button></p></div>`);
 return S(`<h2>${t('rq')} (${db.r.length})</h2><div class="panel tbl" style="margin-top:0">${db.r.length?`<table><tr><th>ID</th><th></th><th></th><th></th><th></th></tr>${db.r.map(r=>`<tr><td>EDU-${String(r.id).padStart(4,'0')}<br><span class="m">${r.date}</span></td><td><b>${esc(r.name)}</b>, ${r.age}<br>${esc(r.ph)} · ${L(DIST[r.d])}<br><span class="m">${esc(r.cls)}</span>${r.gn?`<br><span class="m">${t('guard')}: ${esc(r.gn)} ${esc(r.gp)}</span>`:''}</td><td>${t('t'+r.ty)}<br><span class="m">${r.x1!==''?L(r.ty==0?XO.x10[r.x1]:r.ty==1?XO.x11[r.x1]:XO.x12[r.x1]):''}</span><br><span class="m">${esc(r.note)}</span></td><td><select onchange="setS(${r.id},this.value)">${[0,1,2,3].map(i=>`<option value="${i}"${r.s==i?' selected':''}>${t('st'+i)}</option>`).join('')}</select></td></tr>`).join('')}</table>`:`<span class="m">${t('none')}</span>`}</div><p><button class="btn ghost" style="color:var(--ink)" onclick="isAdmin=false;draw()">${t('out')}</button></p>`)}
function setS(id,v){db.r.find(r=>r.id==id).s=+v;save();toast(t('st'+v))}
function draw(){const A=document.getElementById('app');
 A.querySelectorAll('[id]').forEach(e=>{if('value'in e&&e.type!='file'&&e.type!='checkbox')fv[e.id]=e.value});try{localStorage.setItem('kth_draft_education',JSON.stringify(fv))}catch(e){}
 document.getElementById('bn').textContent=t('brand');
 document.getElementById('ft').innerHTML = typeof getOurSupportFooter === 'function' ? getOurSupportFooter(lang) : `<div class="wrap"><b>${t('brand')}</b></div>`;
 document.getElementById('nav').innerHTML=TL.map(([k])=>`<button class="${view==k?'on':''}" onclick="go('${k}')">${t(k)}</button>`).join('')+`<button class="lg" onclick="setLang()">${t('lang')}</button><button class="lg" onclick="big()" title="${t('a11y')}" aria-label="${t('a11y')}">A+</button><button class="lg" onclick="hc()" title="${t('hcn')}" aria-label="${t('hcn')}">◐</button>`;
 A.innerHTML=({home,finder,sch,guide,req,inst,track,admin})[view]();
 A.querySelectorAll('[id]').forEach(e=>{if(fv[e.id]!=null&&'value'in e&&e.type!='file'&&e.type!='checkbox')e.value=fv[e.id]});
 gChg()}
document.documentElement.lang=lang;draw();
</script>
</body>
</html>
