<style>
:root{--bg:#F1F5F4;--card:#fff;--ink:#16232B;--mute:#5A6B72;--teal:#12504B;--tealx:#0C3A36;--gold:#F2A93B;--rose:#C2455B;--line:#D9E2E0;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1C;--card:#172629;--ink:#E7F0EF;--mute:#9DB1B2;--teal:#3FA898;--tealx:#0A2A28;--line:#264043;--on:#0F1A1C}}
:root[data-theme="dark"]{--bg:#0F1A1C;--card:#172629;--ink:#E7F0EF;--mute:#9DB1B2;--teal:#3FA898;--tealx:#0A2A28;--line:#264043;--on:#0F1A1C}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins','Noto Sans Malayalam',system-ui,sans-serif;line-height:1.7}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:space-between;padding:10px 5vw;background:var(--card);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.4rem;color:var(--teal);cursor:pointer}
nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
nav button{background:none;border:0;padding:7px 12px;border-radius:8px;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer}
nav button.on{background:var(--teal);color:var(--on)}
nav .lg{border:1px solid var(--line);margin-left:6px}
.wrap{max-width:1040px;margin:0 auto;padding:0 5vw}
.hero{background:var(--tealx);color:#fff}
.hero .wrap{display:grid;grid-template-columns:1.3fr .7fr;gap:24px;align-items:center;padding-top:56px;padding-bottom:56px}
.hero h1{font-size:clamp(1.8rem,4.6vw,2.9rem);line-height:1.3;margin:0 0 14px;font-weight:700}
.hero p{max-width:56ch;color:#CFE3E0;font-size:1.05rem;margin:0 0 24px}
.hero svg{width:100%;max-width:280px;justify-self:center}
@media(max-width:720px){.hero .wrap{grid-template-columns:1fr}.hero svg{max-width:160px}}
.btn{background:var(--teal);color:var(--on);border:0;border-radius:10px;padding:11px 22px;font:inherit;font-weight:600;cursor:pointer}
.btn.gold{background:var(--gold);color:#16232B}
.btn.ghost{background:none;color:inherit;border:1px solid currentColor}
.btn.bad{background:var(--rose);color:#fff}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sec{padding:44px 0}
.sec h2{font-size:1.6rem;margin:0 0 18px}
.pill{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.pill div{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:12px;padding:16px}
.pill b{display:block;margin-bottom:4px}
.pill span,.m{color:var(--mute);font-size:.93rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;counter-reset:s}
.steps div{position:relative;padding-left:52px}
.steps div:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:38px;height:38px;border-radius:50%;background:var(--teal);color:var(--on);display:grid;place-items:center;font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
label{display:block;font-size:.88rem;color:var(--mute);margin-bottom:2px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input[type=checkbox]{width:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:16px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pc img{width:100%;aspect-ratio:4/4.2;object-fit:cover;display:block;background:var(--line)}
.pc .b{padding:14px;display:flex;flex-direction:column;gap:2px;flex:1}
.pc h3{margin:0;font-size:1.08rem}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:0 10px;font-size:.8rem;margin:6px 4px 0 0}
.hid{color:var(--mute);font-size:.8rem;margin:8px 0}
.pc .btn{padding:9px 14px}
.note{background:rgba(242,169,59,.18);border-radius:10px;padding:10px 14px;font-size:.9rem;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:9}
#pv{display:none;width:120px;height:130px;object-fit:cover;border-radius:10px;margin-top:8px}
.tbl{overflow-x:auto}
footer{background:var(--tealx);color:#CFE3E0;padding:26px 5vw;font-size:.9rem;margin-top:30px}

.gov{background:var(--gold);color:#16232B;text-align:center;font-size:.85rem;font-weight:600;padding:6px 5vw}
.hero{position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1;padding-top:76px;padding-bottom:76px}
.hero .wrap>div:first-child{animation:rise .9s ease-out both}
.bg i{position:absolute;border-radius:50%;border:10px solid rgba(255,255,255,.07);animation:fl 16s ease-in-out infinite alternate}
.bg i:nth-child(1){width:340px;height:340px;left:-90px;top:-100px}
.bg i:nth-child(2){width:340px;height:340px;left:70px;top:-60px;border-color:rgba(242,169,59,.16);animation-delay:-4s}
.bg i:nth-child(3){width:220px;height:220px;right:8%;bottom:-70px;animation-delay:-8s}
.bg i:nth-child(4){width:220px;height:220px;right:calc(8% + 90px);bottom:-40px;border-color:rgba(242,169,59,.14);animation-delay:-2s}
.bg i:nth-child(5){width:90px;height:90px;left:44%;top:14%;border-width:6px;animation-duration:11s}
.bg i:nth-child(6){width:60px;height:60px;right:30%;top:10%;border-width:5px;border-color:rgba(242,169,59,.2);animation-duration:13s}
@keyframes fl{from{transform:translate(0,0) rotate(0)}to{transform:translate(26px,-22px) rotate(25deg)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero h1{font-size:clamp(2rem,5vw,3.3rem)}
.sec h2:after{content:"";display:block;width:44px;height:4px;background:var(--gold);border-radius:2px;margin-top:8px}
.pc,.pill div{transition:transform .2s,box-shadow .2s}
.pc:hover,.pill div:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(18,80,75,.14)}
footer .wrap{padding:0}
@media(prefers-reduced-motion:reduce){.bg i,.hero .wrap>div:first-child{animation:none}}
.pf{display:grid;grid-template-columns:280px 1fr;gap:26px;align-items:start}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 20px}
.cta{background:var(--tealx);color:#fff}.cta .wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-top:34px;padding-bottom:34px}.cta h2{margin:0;font-size:1.5rem}.cta span{color:#CFE3E0}
@media(max-width:720px){.pf{grid-template-columns:1fr}}
.hero svg.wave{max-width:none;width:100%;height:40px;position:absolute;left:0;bottom:-1px;z-index:1}
.hp{transform-box:fill-box;transform-origin:center;animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.14)}}
.qs{position:relative;z-index:2;margin-top:-30px}.qs .panel{margin-top:0;box-shadow:0 12px 30px rgba(18,80,75,.16)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.badge{display:inline-block;border-radius:20px;padding:2px 12px;font-size:.85rem;font-weight:600}.badge.p{background:rgba(242,169,59,.28)}.badge.l{background:rgba(63,168,152,.28)}
@media(prefers-reduced-motion:reduce){.hp{animation:none}}
.sup{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:20px}.sup .wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-top:30px;padding-bottom:30px}.sup h2{margin:0 0 4px}.sup p{margin:0;color:var(--mute)}
.gp{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--bg);border:1px dashed var(--gold);border-radius:12px;padding:12px 16px;margin-top:8px}.gp b{font-size:1.4rem;letter-spacing:.04em}
.qt{margin:18px 0;padding:14px 20px;border-left:5px solid var(--gold);font-size:1.1rem;font-style:italic}
.homelink{font-size:.85rem;font-weight:600;color:var(--teal);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:4px 12px;white-space:nowrap}
</style>
</head>

<div>${delAsk?`<p>${t('delq')}</p><div class="row"><button class="btn bad" onclick="delMe()">${t('yes')}</button><button class="btn ghost" style="color:var(--ink)" onclick="delAsk=false;draw()">${t('cancel')}</button></div>`:`<button class="btn ghost" style="color:var(--rose)" onclick="delAsk=true;draw()">${t('del')}</button>`}</div></div></div>
<h2 style="margin-top:32px">${t('sug')}</h2><div class="cards">${m.length?m.map(card).join(''):`<p class="m">${t('nomatch')}</p>`}</div>`)}
function openEdit(){fv={};FG.forEach(g=>g[1].forEach(([k])=>fv['f_'+k]=me[k]??''));photo=me.ph;fv.d_id=me.dId??0;fv.d_st=me.dSt;docs=Object.assign({},me.docs||{});go('edit')}
function edit(){if(!me)return login();return S(`<h2>${t('edit')}</h2>`+panels(1)+`<p class="row"><button class="btn" onclick="saveEdit()">${t('save')}</button><button class="btn ghost" style="color:var(--ink)" onclick="photo=null;docs={};fv={};go('mine')">${t('cancel')}</button></p>`)}
function readF(){const o={};FG.forEach(g=>g[1].forEach(([k,ty])=>{const v=document.getElementById('f_'+k).value.trim();o[k]=v===''?'':(ty=='n'||ty=='s')?+v:v}));return o}
function saveEdit(){const o=readF();kidFix(o);if(!o.name||!(o.age>=18)||!docs.idImg||o.st!==0&&!docs.stImg){toast(t('errd'));return}o.phone=me.phone;Object.assign(me,o,{ph:photo||me.ph,ok:0,dId:+document.getElementById('d_id').value,dSt:o.st?+document.getElementById('d_st').value:'',docs:Object.assign({},docs)});save();photo=null;fv={};toast(t('saved'));go('mine')}
function delMe(){db.p=db.p.filter(x=>x.id!=me.id);db.i=db.i.filter(x=>x.from!=me.id&&x.to!=me.id);setMe(null);save();go('home')}
function respond(f,ok){const x=db.i.find(x=>x.from==f&&x.to==me.id&&!x.s);if(x){x.s=ok?1:2;save();draw();toast(t(ok?'st1':'st2'))}}
function adm(i,v){db.i[i].s=v;save();draw()}
function logout(){setMe(null);fv={};go('home')}
function qs(){const v=i=>document.getElementById(i).value;fv={fg:v('q_g'),f1:v('q_a1'),f2:v('q_a2'),fd:v('q_d')};go('search');doSearch()}
function qsBlock(){return `<div class="wrap qs"><div class="panel"><div class="grid"><div><label>${t('lk')}</label><select id="q_g"><option value="">${t('all')}</option><option value="F">${t('bride')}</option><option value="M">${t('groom')}</option></select></div><div><label>${t('from')}</label><input id="q_a1" type="number" value="18"></div><div><label>${t('to')}</label><input id="q_a2" type="number" value="60"></div><div><label>${t('d')}</label><select id="q_d">${dO(1)}</select></div></div><p style="margin:14px 0 0"><button class="btn" onclick="qs()">${t('go')}</button></p></div></div>`}
function feat(){return S(`<h2>${t('feat')}</h2><div class="cards">${db.p.filter(p=>p.ok).slice(0,4).map(card).join('')}</div><p style="margin-top:20px"><button class="btn" onclick="go('search')">${t('all2')}</button></p>`)}
function docBlock(){return `<div class="panel"><h3 style="margin:0 0 6px">${t('docs')}</h3><p class="m" style="margin-top:0">${t('docsd')}</p><div class="grid"><div><label>${t('idp')} *</label><select id="d_id">${IDD.map((x,i)=>`<option value="${i}">${L(x)}</option>`).join('')}</select></div><div><label>${t('upl')} * <span id="n_idImg"></span></label><input type="file" accept="image/*" onchange="pickDoc(this,'idImg')"></div></div><div id="stdoc" style="margin-top:14px"></div></div>`}
function pickDoc(inp,key){const fl=inp.files[0];if(!fl)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,700/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);docs[key]=c.toDataURL('image/jpeg',.5);const n=document.getElementById('n_'+key);if(n)n.textContent='✓'};im.src=e.target.result};r.readAsDataURL(fl)}
function kidFix(o){if(o.st===0)o.hk='';if(o.st===0||o.hk!==1){o.kids='';o.kl=''}}
function copyNo(){try{navigator.clipboard.writeText('9745226500').then(()=>toast(t('copied')),()=>toast('9745226500'))}catch(e){toast('9745226500')}}
function supportBand(){return `<section class="sup"><div class="wrap"><div><h2>${t('supt')}</h2><p>${t('supd')}</p></div><button class="btn gold" onclick="go('support')">${t('supb')}</button></div></section>`}
function support(){const Q=(a,b)=>L([a,b]);return S(`<h2>${t('supt')}</h2>
<div class="panel"><b>${t('ctad')}</b><p>${Q('ജീവിതപങ്കാളിയെ കണ്ടെത്തുന്നത് സാമ്പത്തിക ബാധ്യതയാകരുത് എന്ന ആശയത്തിലാണ് ഈ സേവനം ആരംഭിച്ചത്. രജിസ്റ്റർ ചെയ്യാനോ അനുയോജ്യമായ ബന്ധങ്ങൾ അന്വേഷിക്കാനോ സേവനം ഉപയോഗിക്കാനോ യാതൊരു ഫീസും ഈടാക്കുന്നില്ല.','This service was started on the belief that finding a life partner should never be a financial burden. It is 100% free: no fee is charged to register, search for matches or use the service.')}</p></div>
<div class="panel"><b>${Q('സ്വമേധയാ ഉള്ള പിന്തുണ','Voluntary support')}</b><p>${Q('ഇവിടെ നിന്ന് അനുയോജ്യമായ ജീവിതപങ്കാളിയെ കണ്ടെത്തുകയും ഈ സേവനം പ്രയോജനപ്പെടുകയും ചെയ്താൽ, വിവാഹനിശ്ചയത്തിനോ വിവാഹത്തിനോ ശേഷം ഇഷ്ടാനുസരണം ഈ സംരംഭത്തെ പിന്തുണയ്ക്കാം. സംഭാവന പൂർണ്ണമായും സ്വമേധയാ ഉള്ളതാണ്: നിർബന്ധമില്ല, നിബന്ധനയില്ല. നൽകാത്തതിന് അധിക ഫീസോ നിയന്ത്രണമോ ഉണ്ടാകില്ല.','If you find your life partner here and appreciate this free service, you may, after a successful engagement or marriage, voluntarily contribute any amount so that we can keep it free for future brides, grooms and families. It is completely voluntary: no obligation, no conditions, and no extra fee or restriction if you choose not to give.')}</p>
<div class="gp"><span class="m">GPay</span><b>9745226500</b><button class="btn gold" onclick="copyNo()">${t('cp')}</button></div></div>
<blockquote class="qt">${Q('“നിങ്ങൾ പങ്കാളിയെ കണ്ടെത്തിയത് സൗജന്യമായി. നിങ്ങളുടെ സ്വമേധയാ ഉള്ള പിന്തുണ മറ്റൊരാൾക്കും സൗജന്യമായി പങ്കാളിയെ കണ്ടെത്താൻ സഹായിക്കട്ടെ.”','“You found your match for free. Your voluntary support can help someone else find theirs, also for free.”')}</blockquote>
<div class="panel"><p style="margin:0">${Q('സംഭാവനകൾ വലിയ തുകയായി വളർന്നാൽ സമൂഹവിവാഹം പോലുള്ള പരിപാടികൾ സംഘടിപ്പിച്ച് ഇതിനെ വലിയൊരു സാമൂഹിക പ്രവർത്തനമാക്കി മാറ്റാൻ ഞങ്ങൾ ആഗ്രഹിക്കുന്നു.','If contributions grow, we hope to organise community weddings and turn this into a larger social initiative.')}</p></div>
<div class="note">${t('legal')}</div><p class="m">${Q('സ്നേഹത്തോടെയും വിശ്വാസത്തോടെയും ഈ സേവനത്തെ പിന്തുണയ്ക്കുന്ന എല്ലാവർക്കും നന്ദി.','Thank you to everyone who supports this service with love and trust.')}</p>`)}
function pick(inp){const fl=inp.files[0];if(!fl)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,360/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.7);const v=document.getElementById('pv');v.src=photo;v.style.display='block'};im.src=e.target.result};r.readAsDataURL(fl)}
function submitReg(){const o={};FG.forEach(g=>g[1].forEach(([k,ty])=>{const v=document.getElementById('f_'+k).value.trim();o[k]=v===''?'':(ty=='n'||ty=='s')?+v:v}));
 kidFix(o);
 if(!o.name||!(o.age>=18)||o.phone.length!=10||!photo||!docs.idImg||!document.getElementById('cs').checked||o.st!==0&&!docs.stImg){toast(t('errd'));return}
 if(db.p.some(x=>x.phone==o.phone)){toast(t('dup'));return}
 const np=Object.assign({id:db.next++,ph:photo,ok:0,dId:+document.getElementById('d_id').value,dSt:o.st?+document.getElementById('d_st').value:'',docs:Object.assign({},docs)},o);db.p.push(np);setMe(np);justReg=true;save();
 if(typeof syncRecordToCloud==='function'){
  syncRecordToCloud('matrimony','profile',{
   ref:'MAT-'+String(np.id).padStart(4,'0'),
   name:np.name,
   gender:np.g=='F'?'Female':'Male',
   age:np.age,
   phone:np.phone,
   district:DIST[np.d]?DIST[np.d][1]:np.d,
   education:np.edu||'',
   job:np.job||'',
   details:np.about||''
  });
 }
 fv={};photo=null;docs={};draw()}
function openP(id){pid=id;go('prof')}
function prof(){const p=db.p.find(x=>x.id==pid);if(!p)return S('');
 const row=([k,ty,,o])=>{if(PRIV.includes(k)&&!isAdmin||k=='ab'||k=='name'||p.st==0&&['hk','kids','kl'].includes(k))return '';let v=p[k];if(v===''||v==null||(k=='pa1'||k=='pa2')&&!v)return '';
  v=ty=='s'?L(o[v]):ty=='g'?t(v=='F'?'f':'m'):k=='ht'?v+' cm':esc(L(v));return `<div><small class="m">${lb(k)}</small><br><b>${v}</b></div>`};
 const gr=FG.map(g=>{const r=g[1].map(row).join('');return r?`<div class="panel" style="margin-top:0"><h3 style="margin:0 0 12px">${lb(g[0])}</h3><div class="dl">${r}</div></div>`:''}).join('');
 const dp=isAdmin&&p.docs?`<div class="panel" style="margin-top:0"><h3 style="margin:0 0 12px">${t('docs')} (${t('adm')})</h3>${p.docs.idImg?`<p class="m">${L(IDD[p.dId]||IDD[5])}</p><img src="${p.docs.idImg}" alt="" style="max-width:100%;border-radius:8px">`:''}${p.docs.stImg?`<p class="m">${L((SD[p.st]||[])[p.dSt]||OT)}</p><img src="${p.docs.stImg}" alt="" style="max-width:100%;border-radius:8px">`:''}</div>`:'';
 return S(`<button class="btn ghost" style="color:var(--ink);margin-bottom:18px" onclick="go('search')">← ${t('back')}</button><div class="pf"><div><img src="${img(p)}" alt="" style="width:100%;border-radius:14px;aspect-ratio:4/4.4;object-fit:cover"><h2 style="margin:14px 0 2px">${esc(L(p.name))}</h2><div class="m">${p.age} ${t('yrs')} · ${L(DIST[p.d])}</div><div class="hid">${isAdmin?t('adm'):t('priv')}</div><button class="btn" onclick="interest(${p.id})">${t('int')}</button></div>
<div style="display:grid;gap:14px"><div class="panel" style="margin-top:0"><p style="margin:0">${esc(L(p.about))||'—'}</p></div>${gr}${dp}</div></div>`)}
function search(){const list=res||db.p.filter(p=>p.ok);
 return S(`<h2>${t('search')}</h2><div class="panel" style="margin-top:0"><div class="grid">
<div><label>${t('lk')}</label><select id="fg"><option value="">${t('all')}</option><option value="F">${t('bride')}</option><option value="M">${t('groom')}</option></select></div>
<div><label>${t('from')}</label><input id="f1" type="number" value="18"></div><div><label>${t('to')}</label><input id="f2" type="number" value="60"></div>
<div><label>${t('d')}</label><select id="fd">${dO(1)}</select></div><div><label>${t('st')}</label><select id="fs">${sO(1)}</select></div></div>
<p><button class="btn" onclick="doSearch()">${t('go')}</button> <button class="btn ghost" onclick="res=null;fv={};draw()">${t('clr')}</button></p></div>
<p class="m">${list.length} ${t('cnt')}</p><div class="cards">${list.map(card).join('')||`<p>${t('none')}</p>`}</div>`)}
function doSearch(){const v=i=>document.getElementById(i).value,a=+v('f1'),b=+v('f2');
 res=db.p.filter(p=>p.ok&&(!v('fg')||p.g==v('fg'))&&p.age>=a&&p.age<=b&&(v('fd')===''||p.d==v('fd'))&&(v('fs')===''||p.st==v('fs')));draw()}
function admin(){
 if(!isAdmin)return S(`<h2>${t('al')}</h2><div class="panel"><label>${t('pin')}</label><input id="pin" type="password" style="max-width:220px"><p><button class="btn" onclick="if(document.getElementById('pin').value=='1234'){isAdmin=true;draw()}else toast(t('badpin'))">${t('enter')}</button></p></div>`);
 const pd=db.p.filter(p=>!p.ok);
 return S(`<h2>${t('pend')} (${pd.length})</h2><div class="cards">${pd.map(p=>`<div class="pc"><img src="${img(p)}" alt=""><div class="b"><h3>${esc(L(p.name))}</h3><div class="m">${p.age} ${t('yrs')} · ${L(DIST[p.d])} · ${L(ST[p.st])}</div><p class="m">${esc(L(p.about))}</p><div class="m">${t('phl')}: ${esc(p.phone||'-')}</div><button class="btn ghost" style="color:var(--ink);margin-top:8px" onclick="openP(${p.id})">${t('view')}</button><div class="row" style="margin-top:10px"><button class="btn" onclick="dec(${p.id},1)">${t('ok')}</button><button class="btn bad" onclick="dec(${p.id},0)">${t('no')}</button></div></div></div>`).join('')||`<p class="m">${t('nop')}</p>`}</div>
<h2 style="margin-top:32px">${t('ints')} (${db.i.length})</h2><div class="panel tbl">${db.i.length?`<table width="100%">${db.i.map((x,i)=>{const a=db.p.find(p=>p.id==x.from),b=db.p.find(p=>p.id==x.to);return `<tr><td>${esc(a&&L(a.name))}</td><td>→</td><td>${esc(b&&L(b.name))}</td><td class="m">${t('st'+(x.s||0))}</td><td>${x.s==1?`<button class="btn" style="padding:5px 12px" onclick="adm(${i},3)">${t('conn')}</button>`:x.s==3?esc((a&&a.phone||'-')+' / '+(b&&b.phone||'-')):!x.s&&b&&!b.phone?`<button class="btn ghost" style="color:var(--ink);padding:5px 12px" onclick="adm(${i},1)">${t('sim')}</button>`:''}</td></tr>`}).join('')}</table>`:`<span class="m">${t('noi')}</span>`}</div>
<p><button class="btn ghost" style="color:var(--ink)" onclick="isAdmin=false;draw()">${t('out')}</button></p>`)}
function dec(id,ok){if(ok)db.p.find(p=>p.id==id).ok=1;else db.p=db.p.filter(p=>p.id!=id);save();draw();toast(t(ok?'okd':'nod'))}
function draw(){const A=document.getElementById('app');
 A.querySelectorAll('[id]').forEach(e=>{if('value'in e&&e.type!='file')fv[e.id]=e.value});
 document.getElementById('bn').textContent=t('brand');document.getElementById('ft').innerHTML=`<div class="wrap"><b>${t('brand')}</b> · ${t('tag')}<br><span style="opacity:.8">${t('foot')} · <a href="#" onclick="go('support');return false" style="color:#fff">${t('support')}</a></span><br><span style="opacity:.7;font-size:.82rem">${t('legal')}</span></div>`;
 document.getElementById('nav').innerHTML=(me?['home','mine','search','support','admin']:['home','reg','login','search','support','admin']).map(k=>`<button class="${view==k?'on':''}" onclick="go('${k}')">${t(k)}</button>`).join('')+`<button class="lg" onclick="setLang()">${t('lang')}</button>`+(me?`<button class="lg" onclick="logout()">${t('logout')}</button>`:'');
 A.innerHTML=({home,reg,login,mine,edit,search,support,admin,prof})[view]();
 A.querySelectorAll('[id]').forEach(e=>{if(fv[e.id]!=null&&'value'in e&&e.type!='file'&&e.type!='checkbox')e.value=fv[e.id]});
 if(document.getElementById('f_st'))stChg(1);
 ['idImg','stImg'].forEach(k=>{const n=document.getElementById('n_'+k);if(n&&docs[k])n.textContent='✓'});
 if(view=='edit'){const e=document.getElementById('f_phone');if(e)e.disabled=true}
 if(photo&&document.getElementById('pv')){const v=document.getElementById('pv');v.src=photo;v.style.display='block'}}
document.documentElement.lang=lang;draw();
</script>
</body>
</html>
