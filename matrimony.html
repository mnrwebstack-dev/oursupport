let isSyncingCloud = false;
let lastCloudSyncTime = '';

async function syncMatrimonyFromCloud(onDone) {
  if (isSyncingCloud) return;
  isSyncingCloud = true;
  try {
    if (typeof fetchCloudRecords === 'function') {
      const rawRecords = await fetchCloudRecords('matrimony', 'profile');
      if (Array.isArray(rawRecords) && rawRecords.length > 0) {
        // CRITICAL FILTER: Ignore empty rows and rows without genuine name & phone
        const records = rawRecords.filter(rec => {
          const rName = String(rec.Name || rec.name || '').trim();
          const rPhone = String(rec.Phone || rec.phone || '').trim();
          return rName && rName !== 'അജ്ഞാതൻ' && rName !== 'Member' && rPhone && rPhone.length >= 7;
        });

        records.forEach(rec => {
          const phone = String(rec.Phone || rec.phone || '').trim();
          const ref = String(rec.Reference || rec.ref || '').trim();
          const rawId = parseInt(ref.replace(/\D/g, ''), 10);
          const parsedId = (!isNaN(rawId) && rawId > 0) ? rawId : db.next++;
          
          let p = db.p.find(x => (phone && String(x.phone) === phone) || (x.ref && x.ref === ref) || x.id === parsedId);
          
          const isApproved = String(rec.Status || '').trim().toLowerCase() === 'approved';
          const distName = String(rec.District || rec.district || '').toLowerCase();
          let distIdx = DIST.findIndex(d => distName.includes(d[0].toLowerCase()) || distName.includes(d[1].toLowerCase()));
          if (distIdx === -1) distIdx = 9;
          
          const gender = (String(rec.Gender || '').trim().toLowerCase().startsWith('f') || rec.Gender === 'F') ? 'F' : 'M';
          const age = parseInt(rec.Age, 10) || 28;
          const edu = rec.Education || '';
          const job = rec.Job || '';
          const about = rec.About || rec.Details || '';
          const photoData = rec.PhotoData || rec.photo || '';
          
          if (!p) {
            p = {
              id: parsedId,
              ref: ref || ('MAT-' + String(parsedId).padStart(4, '0')),
              name: [rec.Name, rec.Name],
              g: gender,
              age: age,
              d: distIdx,
              edu: [edu, edu],
              job: [job, job],
              st: 0,
              about: [about, about],
              phone: phone,
              ph: photoData || null,
              ok: isApproved ? 1 : 0,
              source: 'cloud',
              cloudTs: rec.Timestamp || '',
              cloudStatus: rec.Status || 'New'
            };
            db.p.push(p);
          } else {
            // Once approved (either locally or in cloud), NEVER revert to 0
            if (isApproved || p.ok === 1) p.ok = 1;
            if (photoData && !p.ph) p.ph = photoData;
            p.cloudStatus = isApproved ? 'Approved' : (p.cloudStatus || rec.Status);
          }
          if (p.id >= db.next) db.next = p.id + 1;
        });
        
        // Final sanity check: Ensure no corrupt entries in db.p
        db.p = db.p.filter(p => {
          const pName = p.name ? (Array.isArray(p.name) ? p.name[0] : p.name) : '';
          const pPhone = String(p.phone || '').trim();
          return pPhone.length >= 7 && pName && pName !== 'അജ്ഞാതൻ' && pName !== 'Member';
        });

        save();
        lastCloudSyncTime = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      }
    }
  } catch(e) {
    console.warn('Sync notice:', e);
  } finally {
    isSyncingCloud = false;
    if (typeof onDone === 'function') onDone();
    if (typeof draw === 'function') draw();
  }
}

function adminAttachPhoto(id, inp) {
  const fl = inp.files[0];
  if (!fl) return;
  const r = new FileReader();
  r.onload = e => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas');
      const k = Math.min(1, 360 / Math.max(im.width, im.height));
      c.width = im.width * k;
      c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL('image/jpeg', 0.75);
      const p = db.p.find(x => x.id == id);
      if (p) {
        p.ph = dataUrl;
        save();
        draw();
        toast(lang == 'ml' ? 'ഫോട്ടോ വിജയകരമായി അറ്റാച്ച് ചെയ്തു!' : 'Photo attached successfully!');
      }
    };
    im.src = e.target.result;
  };
  r.readAsDataURL(fl);
}

function adminAttachDoc(id, inp) {
  const fl = inp.files[0];
  if (!fl) return;
  const r = new FileReader();
  r.onload = e => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas');
      const k = Math.min(1, 700 / Math.max(im.width, im.height));
      c.width = im.width * k;
      c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL('image/jpeg', 0.55);
      const p = db.p.find(x => x.id == id);
      if (p) {
        p.docs = p.docs || {};
        p.docs.idImg = dataUrl;
        save();
        draw();
        toast(lang == 'ml' ? 'തിരിച്ചറിയൽ രേഖ അറ്റാച്ച് ചെയ്തു!' : 'ID document attached successfully!');
      }
    };
    im.src = e.target.result;
  };
  r.readAsDataURL(fl);
}

function doAdminLogin(){
  const pinEl = document.getElementById('pin');
  const val = pinEl ? pinEl.value.trim() : '';
  const valid = ['974522', '1234', '9745', '9745226500'];
  if(valid.includes(val) || (window.OURSUPPORT_CONFIG && val === OURSUPPORT_CONFIG.adminPin)){
    isAdmin = true;
    view = 'admin';
    draw();
    toast(lang == 'ml' ? 'അഡ്മിൻ ലോഗിൻ ചെയ്തു' : 'Admin Signed In');
    if(typeof syncMatrimonyFromCloud === 'function'){
      syncMatrimonyFromCloud(()=>{ draw(); });
    }
  } else {
    toast(t('badpin'));
    if(pinEl) pinEl.focus();
  }
}

                <button class="btn bad" style="padding:4px 10px;font-size:0.8rem" onclick="dec(${p.id},0)">${lang=='ml'?'പിൻവലിക്കുക':'Unapprove'}</button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    ` : `<p class="m" style="margin:0">${lang=='ml'?'ഇതുവരെ പ്രൊഫൈലുകൾ ഒന്നും ലൈവ് ആക്കിയിട്ടില്ല.':'No live approved profiles yet.'}</p>`}
  </div>

  <!-- INTEREST REQUESTS SECTION -->
  <h2 style="margin-top:32px">${t('ints')} (${db.i.length})</h2>
  <div class="panel tbl">
    ${db.i.length ? `
      <table width="100%">
        ${db.i.map((x,i)=>{
          const a=db.p.find(p=>p.id==x.from), b=db.p.find(p=>p.id==x.to);
          return `<tr>
            <td>${esc(a&&L(a.name))}</td>
            <td>→</td>
            <td>${esc(b&&L(b.name))}</td>
            <td class="m">${t('st'+(x.s||0))}</td>
            <td>${x.s==1?`<button class="btn" style="padding:5px 12px" onclick="adm(${i},3)">${t('conn')}</button>`:x.s==3?esc((a&&a.phone||'-')+' / '+(b&&b.phone||'-')):!x.s&&b&&!b.phone?`<button class="btn ghost" style="color:var(--ink);padding:5px 12px" onclick="adm(${i},1)">${t('sim')}</button>`:''}</td>
          </tr>`;
        }).join('')}
      </table>
    ` : `<span class="m">${t('noi')}</span>`}
  </div>
 `);
}
function dec(id,ok){
 const p=db.p.find(p=>p.id==id);
 if(!p)return;
 if(ok){
  p.ok=1;
  p.cloudStatus='Approved';
  if(typeof updateCloudRecordStatus==='function'){
   updateCloudRecordStatus('matrimony','profile',p.ref||('MAT-'+p.id),'Approved',{phone:p.phone, photo:p.ph||''});
  }
 }else{
  if(p.ok){
   p.ok=0;
   p.cloudStatus='Unapproved';
   if(typeof updateCloudRecordStatus==='function'){
    updateCloudRecordStatus('matrimony','profile',p.ref||('MAT-'+p.id),'Unapproved',{phone:p.phone});
   }
  }else{
   db.p=db.p.filter(p=>p.id!=id);
   if(typeof updateCloudRecordStatus==='function'){
    updateCloudRecordStatus('matrimony','profile',p.ref||('MAT-'+p.id),'Rejected',{phone:p.phone});
   }
  }
 }
 save();draw();toast(t(ok?'okd':'nod'));
}
function draw(){const A=document.getElementById('app');
 A.querySelectorAll('[id]').forEach(e=>{if('value'in e&&e.type!='file')fv[e.id]=e.value});
 document.getElementById('bn').textContent=t('brand');document.getElementById('ft').innerHTML = typeof getOurSupportFooter==='function' ? getOurSupportFooter(lang) : `<div class="wrap"><b>${t('brand')}</b> · ${t('tag')}</div>`;
 document.getElementById('nav').innerHTML=(me?['home','mine','search','support','admin']:['home','reg','login','search','support','admin']).map(k=>`<button class="${view==k?'on':''}" onclick="go('${k}')">${t(k)}</button>`).join('')+`<button class="lg" onclick="setLang()">${t('lang')}</button>`+(me?`<button class="lg" onclick="logout()">${t('logout')}</button>`:'');
 A.innerHTML=({home,reg,login,mine,edit,search,support,admin,prof})[view]();
 A.querySelectorAll('[id]').forEach(e=>{if(fv[e.id]!=null&&'value'in e&&e.type!='file'&&e.type!='checkbox')e.value=fv[e.id]});
 if(document.getElementById('f_st'))stChg(1);
 ['idImg','stImg'].forEach(k=>{const n=document.getElementById('n_'+k);if(n&&docs[k])n.textContent='✓'});
 if(view=='edit'){const e=document.getElementById('f_phone');if(e)e.disabled=true}
 if(photo&&document.getElementById('pv')){const v=document.getElementById('pv');v.src=photo;v.style.display='block'}}
document.documentElement.lang=lang;draw();
if(typeof syncMatrimonyFromCloud==='function'){syncMatrimonyFromCloud();}
</script>
</body>
</html>
