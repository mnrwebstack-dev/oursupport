html.hc{--bg:#000;--card:#000;--ink:#fff;--mute:#fff;--line:#fff;--teal:#FFD54A;--tealx:#000;--on:#000;--gold:#FFD54A}
html.big{font-size:120%}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins','Noto Sans Malayalam',system-ui,sans-serif;line-height:1.7}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;padding:10px 5vw;background:var(--card);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem;color:var(--teal);cursor:pointer;max-width:340px;line-height:1.3}
nav{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
nav button{background:none;border:0;padding:6px 10px;border-radius:8px;font:inherit;font-size:.88rem;color:var(--ink);cursor:pointer}
nav button.on{background:var(--teal);color:var(--on)}
nav .lg{border:1px solid var(--line);margin-left:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 5vw}
.hero{position:relative;overflow:hidden;background:var(--tealx);color:#fff}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.3fr .7fr;gap:24px;align-items:center;padding-top:72px;padding-bottom:80px}
.hero .wrap>div:first-child{animation:rise .9s ease-out both}
.hero h1{font-size:clamp(1.8rem,4.6vw,3rem);line-height:1.3;margin:0 0 14px;font-weight:700}
.hero p{max-width:56ch;color:#CFE3E0;font-size:1.05rem;margin:0 0 24px}
.hero svg.art{width:100%;max-width:260px;justify-self:center}
.hero svg.wave{position:absolute;left:0;bottom:-1px;width:100%;height:40px;z-index:1}
@media(max-width:720px){.hero .wrap{grid-template-columns:1fr}.hero svg.art{max-width:150px}}
.bg i{position:absolute;border-radius:50%;border:10px solid rgba(255,255,255,.07);animation:fl 16s ease-in-out infinite alternate}
.bg i:nth-child(1){width:320px;height:320px;left:-90px;top:-100px}
.bg i:nth-child(2){width:220px;height:220px;right:6%;bottom:-70px;border-color:rgba(242,169,59,.16);animation-delay:-5s}
.bg i:nth-child(3){width:90px;height:90px;left:44%;top:14%;border-width:6px;animation-duration:11s}
.bg i:nth-child(4){width:60px;height:60px;right:30%;top:10%;border-width:5px;border-color:rgba(242,169,59,.2);animation-duration:13s}
@keyframes fl{from{transform:translate(0,0) rotate(0)}to{transform:translate(26px,-22px) rotate(25deg)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.spark{transform-box:fill-box;transform-origin:center;animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.2)}}
.btn{background:var(--teal);color:var(--on);border:0;border-radius:10px;padding:11px 22px;font:inherit;font-weight:600;cursor:pointer}
.btn.gold{background:var(--gold);color:#16232B}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--rose);color:#fff}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec{padding:40px 0}.sec h2{font-size:1.6rem;margin:0 0 18px}.sec h2:after{content:"";display:block;width:44px;height:4px;background:var(--gold);border-radius:2px;margin-top:8px}
.m{color:var(--mute);font-size:.93rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.tile{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:12px;padding:18px;cursor:pointer;transition:transform .2s,box-shadow .2s;text-align:left;font:inherit;color:inherit}
.tile:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(18,80,75,.14)}
.tile .ic{font-size:1.8rem}.tile b{display:block;margin:4px 0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;counter-reset:s}
.steps div{position:relative;padding-left:52px}
.steps div:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:38px;height:38px;border-radius:50%;background:var(--teal);color:var(--on);display:grid;place-items:center;font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
label{display:block;font-size:.88rem;color:var(--mute);margin-bottom:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}

.note{background:rgba(242,169,59,.18);border-radius:10px;padding:10px 14px;font-size:.9rem;margin-top:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 16px;font:inherit;cursor:pointer}.tabs button.on{background:var(--teal);color:var(--on);border-color:var(--teal)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:10px}summary{cursor:pointer;font-weight:600}
.badge{display:inline-block;border-radius:20px;padding:1px 12px;font-size:.82rem;font-weight:600;background:rgba(242,169,59,.28)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:9}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.cta{background:var(--tealx);color:#fff}.cta .wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-top:32px;padding-bottom:32px}.cta h2{margin:0;font-size:1.4rem}
footer{background:var(--tealx);color:#CFE3E0;padding:24px 5vw;font-size:.88rem;margin-top:30px}
@media(prefers-reduced-motion:reduce){.bg i,.spark,.hero .wrap>div:first-child{animation:none}}
.em{display:block;width:100%;background:var(--rose);color:#fff;font-size:.84rem;font-weight:600;text-align:center;padding:8px 16px;box-sizing:border-box}.em a{color:#fff;text-decoration:underline;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 12px;font-size:.9rem}.chip b{color:var(--rose)}
.warn{background:rgba(194,69,91,.14);border-left:4px solid var(--rose);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:.92rem}
.qx{background:var(--rose)!important;color:#fff!important;border-color:var(--rose)!important;font-weight:600}

.call{display:block;background:var(--rose);color:#fff;border-radius:14px;padding:14px;text-align:center;font-weight:700;font-size:1.4rem;text-decoration:none;line-height:1.3}.call small{display:block;font-weight:400;font-size:.82rem}

.dis{background:#B3261E;color:#fff;padding:12px 5vw;text-align:center;font-weight:600}
.urg0{background:rgba(194,69,91,.25)}.urg1{background:rgba(242,169,59,.28)}
.homelink{font-size:.85rem;font-weight:600;color:var(--teal);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:4px 12px;white-space:nowrap}
</style>

 return S(`<h2>${t('nt_')}</h2><p class="m">${t('nd')}</p>${crit?`<div class="warn"><b>${t('warnK')}</b><div class="calls"><a class="call" href="tel:112">112<small>${t('c112')}</small></a><a class="call" href="tel:108">108<small>${t('c108')}</small></a></div></div>`:''}<div class="panel" style="margin-top:0"><div class="grid"><div><label>${t('cat')} *</label><select id="r_cat">${opt(RC)}</select></div><div><label>${t('urg')} *</label><select id="r_urg" onchange="draw()">${opt(URG)}</select></div><div><label>${t('n')} *</label><input id="r_name"></div><div><label>${t('ph')} *</label><input id="r_ph" inputmode="numeric" maxlength="10"></div><div><label>${t('dd')} *</label><select id="r_d">${opt(DIST)}</select></div><div><label>${t('loc')} *</label><input id="r_loc"></div><div><label>${t('ppl')}</label><input id="r_ppl" type="number" min="1" value="1"></div></div>
<div style="margin-top:14px"><label>${t('nt')}</label><textarea id="r_note" rows="3"></textarea></div><p><label style="color:var(--ink)"><input type="checkbox" id="r_cs"> ${t('cons')}</label></p><p><button class="btn" onclick="sendReq()">${t('send')}</button></p></div><div class="cards">${lcard('health')}</div>`)}
function sendReq(){const v=i=>{const e=document.getElementById(i);return e?e.value.trim():''};
 const phoneClean=typeof OurValidator!=='undefined'?OurValidator.isValidPhone(v('r_ph')):v('r_ph').length==10;
 if(!v('r_name')||!phoneClean||v('r_d')===''||!v('r_loc')){toast(t('err'));return}
 if(!document.getElementById('r_cs').checked){toast(t('errc'));return}
 const recId=db.n++;
 const newRec={id:recId,cat:+v('r_cat'),urg:+v('r_urg'),name:v('r_name'),ph:v('r_ph'),d:+v('r_d'),loc:v('r_loc'),ppl:+v('r_ppl')||1,note:v('r_note'),s:0,date:new Date().toISOString().slice(0,10)};
 db.r.push(newRec);save();
 const ref='EMG-'+pad(recId);
 lastSubmission={
  title:'അടിയന്തര സഹായം (Emergency Support)',
  ref:ref,
  summary:{
   'വിഭാഗം':RC[newRec.cat]?RC[newRec.cat][0]:newRec.cat,
   'അടിയന്തര നില':URG[newRec.urg]?URG[newRec.urg][0]:newRec.urg,
   'പേര്':newRec.name,
   'ഫോൺ':newRec.ph,
   'ജില്ല':DIST[newRec.d]?DIST[newRec.d][0]:newRec.d,
   'സ്ഥലം':newRec.loc,
   'ആളുകളുടെ എണ്ണം':newRec.ppl,
   'വിവരണം':newRec.note||'—'
  }
 };
 if(typeof syncRecordToCloud==='function'){
  syncRecordToCloud('emergency','request',{
   ref:ref,
   category:RC[newRec.cat]?RC[newRec.cat][1]:newRec.cat,
   urgency:URG[newRec.urg]?URG[newRec.urg][1]:newRec.urg,
   name:newRec.name,
   phone:newRec.ph,
   district:DIST[newRec.d]?DIST[newRec.d][1]:newRec.d,
   location:newRec.loc,
   people_count:newRec.ppl,
   details:newRec.note||''
  });
 }
 try{localStorage.removeItem('kth_draft_emergency')}catch(e){};fv={};doneId=recId;draw()}
function give(){if(odone)return S(`<h2>${t('gt')}</h2><div class="note">${t('ook')}</div><p><button class="btn" onclick="go('home')">${t('home')}</button></p>`);
 return S(`<h2>${t('gt')}</h2><p class="m">${t('gd')}</p><div class="panel" style="margin-top:0"><div class="grid"><div><label>${t('n')} *</label><input id="o_name"></div><div><label>${t('et')}</label><select id="o_et">${opt(ET)}</select></div><div><label>${t('ph')} *</label><input id="o_ph" inputmode="numeric" maxlength="10"></div><div><label>${t('dd')} *</label><select id="o_d">${opt(DIST)}</select></div><div><label>${t('otp')}</label><select id="o_t">${opt(OT)}</select></div><div><label>${t('oa')}</label><select id="o_av">${opt(AV)}</select></div></div>
<div style="margin-top:14px"><label>${t('oq')} *</label><textarea id="o_q" rows="2"></textarea></div><p><label style="color:var(--ink)"><input type="checkbox" id="o_c"> ${t('oc')}</label></p><p><button class="btn" onclick="sendO()">${t('send')}</button></p></div>`)}
function sendO(){const v=i=>document.getElementById(i).value.trim();
 const phoneClean=typeof OurValidator!=='undefined'?OurValidator.isValidPhone(v('o_ph')):v('o_ph').length==10;
 if(!v('o_name')||!phoneClean||v('o_q')===''){toast(t('oerr'));return}
 if(!document.getElementById('o_c').checked){toast(t('errc'));return}
 const offId=db.on++;
 const offRec={id:offId,name:v('o_name'),et:+v('o_et'),ph:v('o_ph'),d:+v('o_d'),t:+v('o_t'),av:+v('o_av'),q:v('o_q'),st:0,date:new Date().toISOString().slice(0,10)};
 db.o.push(offRec);save();
 const ref='EMG-OFF-'+pad(offId);
 if(typeof syncRecordToCloud==='function'){
  syncRecordToCloud('emergency','offer',{
   ref:ref,
   name:offRec.name,
   type:ET[offRec.et]?ET[offRec.et][1]:offRec.et,
   phone:offRec.ph,
   district:DIST[offRec.d]?DIST[offRec.d][1]:offRec.d,
   offer_type:OT[offRec.t]?OT[offRec.t][1]:offRec.t,
   availability:AV[offRec.av]?AV[offRec.av][1]:offRec.av,
   quantity_details:offRec.q
  });
 }
 try{localStorage.removeItem('kth_draft_emergency')}catch(e){};fv={};odone=1;draw()}
function volk(){return S(`<h2>${t('vk')}</h2><p class="m">${t('vkd')}</p><div class="cards">${lcard('vol')}</div>`)}
function dir(){const d=fv.dd2,dok=x=>d==null||d===''||x[2]==+d;let l;
 if(dtab==0)l=HL.map(x=>`<div class="card"><h3><a href="tel:${x[0]}" style="color:var(--rose)">${x[0]}</a></h3><span>${L(x[1])}</span></div>`).concat([`<div class="note">${t('cvn')}</div>`]);
 else l=DIR[dtab-1].filter(dok).map(x=>`<div class="card"><h3>${L([x[0],x[1]])}</h3><div><span class="tag">${L(DIST[x[2]])}</span></div><p class="m" style="margin:4px 0">${L(x[3])}</p></div>`);
 return S(`<h2>${t('dr')}</h2>`+TABS([t('d0'),t('d1'),t('d2'),t('d3')],dtab,'setD')+(dtab==0?'':`<div class="panel" style="margin-top:14px;max-width:340px"><label>${t('dd')}</label><select id="dd2" onchange="draw()">${opt(DIST,1)}</select></div>`)+`<div class="cards">${l.join('')||`<p class="m">${t('nores')}</p>`}</div><div class="note">${t('dvn')} ${t('demo')}</div>`)}
function setD(i){dtab=i;draw()}
function track(){const p=fv.tp;const l=p&&p.length==10?db.r.filter(r=>r.ph==p):null;
 return S(`<h2>${t('tr')}</h2><div class="panel" style="margin-top:0;max-width:460px"><p class="m">${t('trd')}</p><input id="tp" inputmode="numeric" maxlength="10"><p><button class="btn" onclick="draw()">${t('trb')}</button></p></div>`+(l?(l.length?`<div class="cards">${l.map(r=>`<div class="card"><b>${pad(r.id)}</b><span>${L(RC[r.cat])}</span><span class="m">${r.date}</span><span class="badge">${t('st'+r.s)}</span></div>`).join('')}</div>`:`<p class="m" style="margin-top:14px">${t('trn')}</p>`):''))}
function admin(){
 if(!isAdmin)return S(`<h2>${t('al')}</h2><div class="panel" style="max-width:340px"><label>${t('pin')}</label><input id="pin" type="password"><p><button class="btn" onclick="if(document.getElementById('pin').value==(window.OURSUPPORT_CONFIG&&OURSUPPORT_CONFIG.adminPin||'974522')){isAdmin=true;draw()}else toast(t('badpin'))">${t('enter')}</button></p></div>`);
 const d=fv.ad_,ok=x=>d==null||d===''||x.d==+d;let body;
 if(atab==0){const l=db.r.filter(ok).slice().sort((a,b)=>a.urg-b.urg||a.id-b.id);body=l.length?`<table>${l.map(r=>{const m=RM[r.cat]!=null?db.o.filter(o=>o.st==2&&o.d==r.d&&o.t==RM[r.cat]):[];return `<tr class="urg${r.urg}"><td>${pad(r.id)}<br><b>${L(URG[r.urg]).split(':')[0]}</b><br><span class="m">${r.date}</span></td><td><b>${esc(r.name)}</b><br>${esc(r.ph)} · ${L(DIST[r.d])}<br><span class="m">${esc(r.loc)} · ${r.ppl}</span></td><td>${L(RC[r.cat])}<br><span class="m">${esc(r.note)}</span>${RM[r.cat]!=null?`<br><b>${t('sug')}: ${m.length}</b>${m.map(o=>`<br><span class="m">${esc(o.name)} ${esc(o.ph)}</span>`).join('')}`:''}</td><td><select onchange="setS(${r.id},this.value)">${[0,1,2,3].map(i=>`<option value="${i}"${r.s==i?' selected':''}>${t('st'+i)}</option>`).join('')}</select></td></tr>`}).join('')}</table>`:`<span class="m">${t('none')}</span>`}
 else if(atab==1){const l=db.o.filter(ok);body=l.length?`<table>${l.map(o=>`<tr><td><b>${esc(o.name)}</b> (${L(ET[o.et])})<br>${esc(o.ph)} · ${L(DIST[o.d])}<br><span class="m">${o.date}</span></td><td>${L(OT[o.t])} · ${L(AV[o.av])}<br><span class="m">${esc(o.q)}</span></td><td><select onchange="setO(${o.id},this.value)">${[0,1,2].map(i=>`<option value="${i}"${o.st==i?' selected':''}>${t('os'+i)}</option>`).join('')}</select></td></tr>`).join('')}</table>`:`<span class="m">${t('none')}</span>`}
 else body=`<p><label style="color:var(--ink)"><input type="checkbox" id="dm_on"${db.dm.on?' checked':''}> <b>${t('dmon')}</b></label></p><label>${t('dmm')}</label><textarea id="dm_msg" rows="2">${esc(db.dm.msg)}</textarea><p><button class="btn" onclick="saveDm()">${t('dms')}</button></p>`;
 return S(`<h2>${t('admin')}</h2>`+(atab==2?'':`<div class="panel" style="margin-top:0;max-width:380px"><label>${t('coord')}</label><select id="ad_" onchange="draw()">${opt(DIST,1)}</select></div>`)+TABS([t('a0')+' ('+db.r.length+')',t('a1')+' ('+db.o.length+')',t('a2')],atab,'setA')+`<div class="panel tbl">${body}</div><p><button class="btn ghost" style="color:var(--ink)" onclick="isAdmin=false;draw()">${t('out')}</button></p>`)}
function setA(i){atab=i;draw()}
function saveDm(){db.dm={on:document.getElementById('dm_on').checked?1:0,msg:document.getElementById('dm_msg').value.trim()};save();draw();toast(t('dms'))}
function setS(id,v){db.r.find(r=>r.id==id).s=+v;save();toast(t('st'+v))}
function setO(id,v){db.o.find(x=>x.id==id).st=+v;save();toast(t('os'+v))}
function draw(){const A=document.getElementById('app');
 A.querySelectorAll('[id]').forEach(e=>{if('value'in e&&e.type!='file'&&e.type!='checkbox'&&!e.id.startsWith('dm_'))fv[e.id]=e.value});try{localStorage.setItem('kth_draft_emergency',JSON.stringify(fv))}catch(e){}
 document.getElementById('bn').textContent=t('brand');
 document.getElementById('em').innerHTML=`${t('em1')} <a href="tel:112">112</a> · <a href="tel:108">108</a>. ${t('em2')}`;
 document.getElementById('ft').innerHTML = typeof getOurSupportFooter === 'function' ? getOurSupportFooter(lang) : `<div class="wrap"><b>${t('brand')}</b></div>`;
 document.getElementById('nav').innerHTML=['home','need','give','volk','dir','track','admin'].map(k=>`<button class="${view==k?'on':''}" onclick="go('${k}')">${t(k)}</button>`).join('')+`<button class="lg" onclick="setLang()">${t('lang')}</button><button class="lg" onclick="big()" title="${t('a11y')}" aria-label="${t('a11y')}">A+</button><button class="lg" onclick="hc()" title="${t('hcn')}" aria-label="${t('hcn')}">◐</button>`;
 A.innerHTML=dBanner()+({home,need,give,volk,dir,track,admin})[view]();
 A.querySelectorAll('[id]').forEach(e=>{if(fv[e.id]!=null&&'value'in e&&e.type!='file'&&e.type!='checkbox'&&!e.id.startsWith('dm_'))e.value=fv[e.id]})}
document.documentElement.lang=lang;draw();
</script>
</body>
</html>
