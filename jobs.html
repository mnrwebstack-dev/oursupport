const GD=[['🎤','ഇന്റർവ്യൂവിന് മുമ്പ്','Before the interview',['സ്ഥാപനത്തെക്കുറിച്ച് അന്വേഷിക്കുക.','രേഖകളുടെ ഫോട്ടോകോപ്പിയും ഒറിജിനലും കരുതുക.','സമയത്തിന് 15 മിനിറ്റ് മുമ്പ് എത്തുക.'],['Find out about the organisation.','Carry original documents and photocopies.','Arrive 15 minutes early.']],['💬','ഇന്റർവ്യൂവിൽ','During the interview',['"നിങ്ങളെക്കുറിച്ച് പറയൂ" എന്ന ചോദ്യത്തിന് തയ്യാറാകുക.','സത്യസന്ധമായും ശാന്തമായും ഉത്തരം പറയുക.','ശമ്പളം, ജോലി സമയം എന്നിവ വ്യക്തമായി ചോദിച്ചറിയുക.'],['Prepare for "tell me about yourself".','Answer honestly and calmly.','Ask clearly about pay and working hours.']],['🧭','കരിയർ മാർഗനിർദ്ദേശം','Career guidance',['നിങ്ങളുടെ കഴിവും താൽപര്യവും എഴുതിവയ്ക്കുക.','പഠിച്ചുകൊണ്ടിരിക്കെ ചെറിയ ജോലി പരിചയം നേടുക.','കൂടുതൽ മാർഗനിർദ്ദേശത്തിന് വിദ്യാഭ്യാസ-കരിയർ സേവനം നോക്കുക.'],['Write down your skills and interests.','Gain small work experience while studying.','See the Education & Career Service for more guidance.']],['⚠️','തട്ടിപ്പ് തിരിച്ചറിയുക','Spotting job scams',['ജോലിക്ക് പണം ചോദിച്ചാൽ അത് തട്ടിപ്പാണ്.','വിദേശ ജോലിക്ക് അംഗീകൃത ഏജൻസികളെ മാത്രം സമീപിക്കുക.','ഓഫർ ലെറ്ററിനും സ്ഥാപനത്തിനും ഉറപ്പ് വരുത്തുക.'],['A fee for a job is a scam.','For overseas jobs, use only approved agencies.','Verify the offer letter and the organisation.']]];

   'ജില്ല':DIST[b.d]?DIST[b.d][0]:b.d,
   'മേഖല':SEC[b.sec]?SEC[b.sec][0]:b.sec,
   'തസ്തിക':etab==0?v('e_t'):`ഒഴിവുകൾ: ${+v('e_n')||1}`,
   'ശമ്പളം':etab==0?v('e_pay'):'—'
  }
 };
 if(typeof syncRecordToCloud==='function'){
  syncRecordToCloud('jobs','employer',{
   ref:ref,
   org:b.o,
   contact:b.c,
   phone:b.p,
   district:DIST[b.d]?DIST[b.d][1]:b.d,
   sector:SEC[b.sec]?SEC[b.sec][1]:b.sec,
   role:etab==0?v('e_t'):'Multiple ('+(+v('e_n')||1)+')',
   pay:etab==0?v('e_pay'):'',
   type:etab==0?'Job Listing':'Bulk Requirement'
  });
 }
 try{localStorage.removeItem('kth_draft_jobs')}catch(e){};fv={};doneId=1;draw()}
function track(){const p=fv.tp;const l=p&&p.length==10?db.s.filter(r=>r.p==p):null;
 return S(`<h2>${t('tr')}</h2><div class="panel" style="margin-top:0;max-width:460px"><p class="m">${t('trd')}</p><input id="tp" inputmode="numeric" maxlength="10"><p><button class="btn" onclick="draw()">${t('trb')}</button></p></div>`+(l?(l.length?`<div class="cards">${l.map(r=>`<div class="card"><b>${esc(r.n)}</b><span class="m">${r.date}</span><span class="badge">${t('st'+r.st)}</span></div>`).join('')}</div>`:`<p class="m" style="margin-top:14px">${t('trn')}</p>`):''))}
function admin(){
 if(!isAdmin)return S(`<h2>${t('al')}</h2><div class="panel" style="max-width:340px"><label>${t('pin')}</label><input id="pin" type="password"><p><button class="btn" onclick="if(document.getElementById('pin').value==(window.OURSUPPORT_CONFIG&&OURSUPPORT_CONFIG.adminPin||'974522')){isAdmin=true;draw()}else toast(t('badpin'))">${t('enter')}</button></p></div>`);
 let body;
 if(atab==0){const pe=db.j.map((j,i)=>[j,i]).filter(x=>!x[0].ok);body=`<b>${t('pend')} (${pe.length})</b>`+(pe.length?`<table>${pe.map(([j,i])=>`<tr><td><b>${esc(j.t)}</b><br><span class="m">${esc(j.o)} · ${esc(j.p)} · ${L(DIST[j.d])}<br>${L(SEC[j.sec])} · ${L(JT[j.jt])} · ${esc(j.pay||'')}<br>${esc(j.hw||'')}</span></td><td><button class="btn" style="padding:5px 12px" onclick="jOk(${i},1)">${t('ok')}</button> <button class="btn bad" style="padding:5px 12px" onclick="jOk(${i},0)">${t('rej')}</button></td></tr>`).join('')}</table>`:`<p class="m">${t('none')}</p>`)+`<p><b>${t('pub')}:</b> ${JOBS.length+db.j.filter(j=>j.ok).length} · <b>${t('reps')}:</b> ${db.rep}</p>`}
 else if(atab==1)body=db.s.length?`<table>${db.s.map(r=>{const m=JOBS.concat(db.j.filter(j=>j.ok)).filter(j=>j.d==r.pd&&j.sec==r.sec&&j.ed<=r.e);return `<tr><td><b>${esc(r.n)}</b>, ${r.a}<br>${esc(r.p)} · ${L(DIST[r.d])}<br><span class="m">${r.date}</span></td><td>${L(ED[r.e])} · ${L(SEC[r.sec])} → ${L(DIST[r.pd])}<br><span class="m">${esc(r.k)} · ${r.y}y</span><br><b>${t('mt')}: ${m.length}</b>${m.map(j=>`<br><span class="m">${typeof j.t=='string'?esc(j.t):L(j.t)}</span>`).join('')}</td><td><select onchange="setSt(${r.id},this.value)">${[0,1,2,3].map(i=>`<option value="${i}"${r.st==i?' selected':''}>${t('st'+i)}</option>`).join('')}</select></td></tr>`}).join('')}</table>`:`<span class="m">${t('none')}</span>`;
 else body=db.e.length?`<table>${db.e.map(e=>`<tr><td><b>${esc(e.o)}</b><br>${esc(e.c)} ${esc(e.p)} · ${L(DIST[e.d])}</td><td>${L(SEC[e.sec])} · ≥ ${L(ED[e.ed])} · × ${e.n}</td></tr>`).join('')}</table>`:`<span class="m">${t('none')}</span>`;
 return S(`<h2>${t('admin')}</h2>`+TABS([t('a0'),t('a1')+' ('+db.s.length+')',t('a2')+' ('+db.e.length+')'],atab,'setA')+`<div class="panel tbl">${body}</div><p><button class="btn ghost" style="color:var(--ink)" onclick="isAdmin=false;draw()">${t('out')}</button></p>`)}
function setA(i){atab=i;draw()}
function jOk(i,ok){if(ok)db.j[i].ok=1;else db.j.splice(i,1);save();draw()}
function setSt(id,v){db.s.find(r=>r.id==id).st=+v;save();toast(t('st'+v))}
function draw(){const A=document.getElementById('app');
 A.querySelectorAll('[id]').forEach(e=>{if('value'in e&&e.type!='file'&&e.type!='checkbox'&&e.id!='cv_out')fv[e.id]=e.value});try{localStorage.setItem('kth_draft_jobs',JSON.stringify(fv))}catch(e){}
 document.getElementById('bn').textContent=t('brand');
 document.getElementById('em').textContent=t('em');
 document.getElementById('ft').innerHTML = typeof getOurSupportFooter === 'function' ? getOurSupportFooter(lang) : `<div class="wrap"><b>${t('brand')}</b></div>`;
 document.getElementById('nav').innerHTML=['home','jobs','cv','guide','skills','own','seek','emp','track','admin'].map(k=>`<button class="${view==k?'on':''}" onclick="go('${k}')">${t(k)}</button>`).join('')+`<button class="lg" onclick="setLang()">${t('lang')}</button><button class="lg" onclick="big()" title="${t('a11y')}" aria-label="${t('a11y')}">A+</button><button class="lg" onclick="hc()" title="${t('hcn')}" aria-label="${t('hcn')}">◐</button>`;
 A.innerHTML=({home,jobs,cv,guide,skills,own,seek,emp,track,admin})[view]();
 A.querySelectorAll('[id]').forEach(e=>{if(fv[e.id]!=null&&'value'in e&&e.type!='file'&&e.type!='checkbox'&&e.id!='cv_out')e.value=fv[e.id]})}
document.documentElement.lang=lang;draw();
</script>
</body>
</html>
