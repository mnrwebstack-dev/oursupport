    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.23 8.23 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23-1.48 0-2.93-.39-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.32a8.19 8.19 0 0 1-1.26-4.36c0-4.54 3.69-8.25 8.24-8.25m-2.52 3.69c-.17 0-.44.07-.67.31-.23.25-.88.86-.88 2.1 0 1.23.91 2.43 1.03 2.59.13.17 1.79 2.72 4.33 3.82.6.26 1.07.42 1.43.53.61.2 1.16.17 1.6.1.49-.07 1.51-.62 1.72-1.21.21-.59.21-1.1.15-1.2-.07-.11-.24-.17-.51-.3-.27-.14-1.6-.79-1.85-.88-.24-.09-.42-.14-.6.12-.17.25-.67.85-.82 1.02-.15.17-.3.19-.57.06-.27-.14-1.13-.42-2.15-1.33-.79-.71-1.33-1.58-1.48-1.84-.15-.26-.02-.4.12-.53.12-.12.27-.31.4-.46.14-.15.18-.26.28-.45.09-.2.04-.36-.03-.49-.06-.13-.57-1.38-.78-1.9-.21-.5-.42-.43-.57-.44-.15-.01-.32-.01-.5-.01"/></svg>
    ${lang=='ml'?'വാട്സ്ആപ്പ് വഴി അറിയിക്കുക':'Notify Team via WhatsApp'}
   </a>
   <button class="btn" onclick="go('track')">${t('track')}</button>
  </div></div>`);
 }
 return S(`<h2>${t('rt')}</h2><p class="m">${t('rd')}</p>${rcat==4||rcat==3?`<div class="warn">${t('warnF')}</div>`:''}<div class="panel" style="margin-top:0"><div class="grid"><div><label>${t('cat')} *</label><select id="r_cat" onchange="rcat=+this.value;draw()">${opt(RC)}</select></div><div><label>${t('n')} *</label><input id="r_name"></div><div><label>${t('ph')} *</label><input id="r_ph" inputmode="numeric" maxlength="10"></div><div><label>${t('dd')} *</label><select id="r_d">${opt(DIST)}</select></div><div><label>${t('safe')}</label><select id="r_safe">${opt(SAFE)}</select></div><div><label>${t('mode')}</label><select id="r_mode">${opt(MODE)}</select></div></div><div style="margin-top:14px"><label>${t('nt')}</label><textarea id="r_note" rows="3"></textarea></div><p><label style="color:var(--ink)"><input type="checkbox" id="r_cs"> ${t('cons')}</label></p><p><button class="btn" onclick="sendReq()">${t('send')}</button></p></div>`)}
function sendReq(){const v=i=>{const e=document.getElementById(i);return e?e.value.trim():''};
 const phoneClean=typeof OurValidator!=='undefined'?OurValidator.isValidPhone(v('r_ph')):v('r_ph').length==10;
 if(!v('r_name')||!phoneClean||v('r_d')===''){toast(t('err'));return}
 if(!document.getElementById('r_cs').checked){toast(t('errc'));return}
 const recId=db.n++;
 const r={id:recId,cat:+v('r_cat'),name:v('r_name'),ph:v('r_ph'),d:+v('r_d'),safe:+v('r_safe'),mode:+v('r_mode'),note:v('r_note'),s:0,date:new Date().toISOString().slice(0,10)};
 db.r.push(r);save();
 const ref='LEG-'+pad(recId);
 lastSubmission={
  title:'നിയമ-സർക്കാർ സഹായം (Legal Desk)',
  ref:ref,
  summary:{
   'പേര്':r.name,
   'വിഭാഗം':RC[r.cat]?RC[r.cat][0]:r.cat,
   'ഫോൺ':r.ph,
   'ജില്ല':DIST[r.d]?DIST[r.d][0]:r.d,
   'അനുയോജ്യ സമയം':SAFE[r.safe]?SAFE[r.safe][0]:r.safe,
   'രീതി':MODE[r.mode]?MODE[r.mode][0]:r.mode,
   'കുറിപ്പ്':r.note||'—'
  }
 };
 if(typeof syncRecordToCloud==='function'){
  syncRecordToCloud('legal','request',{
   ref:ref,
   category:RC[r.cat]?RC[r.cat][1]:r.cat,
   name:r.name,
   phone:r.ph,
   district:DIST[r.d]?DIST[r.d][1]:r.d,
   safe_time:SAFE[r.safe]?SAFE[r.safe][1]:r.safe,
   contact_mode:MODE[r.mode]?MODE[r.mode][1]:r.mode,
   details:r.note||''
  });
 }
 try{localStorage.removeItem('kth_draft_legal')}catch(e){};fv={};doneId=r.id;draw()}
function dir(){const d=fv.dd2,dok=x=>d==null||d===''||x.d==+d;let l;
 if(dtab==1)l=HL.map(x=>`<div class="card"><h3><a href="tel:${x[0]}" style="color:var(--rose)">${x[0]}</a></h3><span>${L(x[1])}</span></div>`).concat([`<div class="note">${t('dvn')}</div>`]);
 else l=(dtab==0?LEG:dtab==2?CEN:CNS).filter(dok).map(x=>`<div class="card"><h3>${L(x.n)}</h3><div><span class="tag">${L(DIST[x.d])}</span></div>${x.i?`<p class="m" style="margin:4px 0">${L(x.i)}</p>`:''}</div>`);
 return S(`<h2>${t('dr')}</h2>`+TABS([t('d0'),t('d1'),t('d2'),t('d3')],dtab,'setD')+(dtab==1?'':`<div class="panel" style="margin-top:14px;max-width:340px"><label>${t('dd')}</label><select id="dd2" onchange="draw()">${opt(DIST,1)}</select></div>`)+`<div class="cards">${l.join('')||`<p class="m">${t('nores')}</p>`}</div><div class="note">${t('all14')} ${t('demo')}</div>`)}
function setD(i){dtab=i;draw()}
function track(){const p=fv.tp;const l=p&&p.length==10?db.r.filter(r=>r.ph==p):null;
 return S(`<h2>${t('tr')}</h2><div class="panel" style="margin-top:0;max-width:460px"><p class="m">${t('trd')}</p><input id="tp" inputmode="numeric" maxlength="10"><p><button class="btn" onclick="draw()">${t('trb')}</button></p></div>`+(l?(l.length?`<div class="cards">${l.map(r=>`<div class="card"><b>${pad(r.id)}</b><span>${L(RC[r.cat])}</span><span class="m">${r.date}</span><span class="badge">${t('st'+r.s)}</span></div>`).join('')}</div>`:`<p class="m" style="margin-top:14px">${t('trn')}</p>`):''))}
function admin(){
 if(!isAdmin)return S(`<h2>${t('al')}</h2><div class="panel" style="max-width:340px"><label>${t('pin')}</label><input id="pin" type="password"><p><button class="btn" onclick="if(document.getElementById('pin').value==(window.OURSUPPORT_CONFIG&&OURSUPPORT_CONFIG.adminPin||'974522')){isAdmin=true;draw()}else toast(t('badpin'))">${t('enter')}</button></p></div>`);
 const d=fv.ad_,l=db.r.filter(r=>d==null||d===''||r.d==+d);
 return S(`<h2>${t('rq')} (${l.length})</h2><div class="panel" style="margin-top:0;max-width:380px"><label>${t('coord')}</label><select id="ad_" onchange="draw()">${opt(DIST,1)}</select></div><div class="panel tbl">${l.length?`<table>${l.map(r=>`<tr><td>${pad(r.id)}<br><span class="m">${r.date}</span></td><td><b>${esc(r.name)}</b><br>${esc(r.ph)} · ${L(DIST[r.d])}<br><span class="m">${t('safe')}: ${L(SAFE[r.safe])} · ${L(MODE[r.mode])}</span></td><td>${L(RC[r.cat])}<br><span class="m">${esc(r.note)}</span></td><td><select onchange="setS(${r.id},this.value)">${[0,1,2,3].map(i=>`<option value="${i}"${r.s==i?' selected':''}>${t('st'+i)}</option>`).join('')}</select></td></tr>`).join('')}</table>`:`<span class="m">${t('none')}</span>`}</div><p><button class="btn ghost" style="color:var(--ink)" onclick="isAdmin=false;draw()">${t('out')}</button></p>`)}
function setS(id,v){db.r.find(r=>r.id==id).s=+v;save();toast(t('st'+v))}
function draw(){const A=document.getElementById('app');
 A.querySelectorAll('[id]').forEach(e=>{if('value'in e&&e.type!='file'&&e.type!='checkbox')fv[e.id]=e.value});try{localStorage.setItem('kth_draft_legal',JSON.stringify(fv))}catch(e){}
 document.getElementById('bn').textContent=t('brand');
 document.getElementById('em').innerHTML=`${t('em1')} <a href="tel:112">112</a>. ${t('em2')}`;
 document.getElementById('ft').innerHTML = typeof getOurSupportFooter === 'function' ? getOurSupportFooter(lang) : `<div class="wrap"><b>${t('brand')}</b></div>`;
 document.getElementById('nav').innerHTML=['home','schemes','docs','rights','rti','req','dir','track','admin'].map(k=>`<button class="${view==k?'on':''}" onclick="go('${k}')">${t(k)}</button>`).join('')+`<button class="lg" onclick="setLang()">${t('lang')}</button><button class="lg" onclick="big()" title="${t('a11y')}" aria-label="${t('a11y')}">A+</button><button class="lg" onclick="hc()" title="${t('hcn')}" aria-label="${t('hcn')}">◐</button><button class="lg qx" onclick="qx()">${t('quick')}</button>`;
 A.innerHTML=({home,schemes,docs,rights,rti,req,dir,track,admin})[view]();
 A.querySelectorAll('[id]').forEach(e=>{if(fv[e.id]!=null&&'value'in e&&e.type!='file'&&e.type!='checkbox'&&e.id!='rt_out')e.value=fv[e.id]});
 if(view=='req'){const c=document.getElementById('r_cat');if(c)c.value=rcat}}
document.documentElement.lang=lang;draw();
</script>
